<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Moto Trial</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfaf4; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; color: #333; font-size: 20px; }
  #hud .box { background: rgba(255,255,255,.85); border: 2px solid #444; border-radius: 10px; padding: 6px 12px; box-shadow: 2px 3px 0 #4443; }
  #speed { width: 180px; }
  #speedbar { height: 10px; border: 2px solid #444; border-radius: 6px; margin-top: 4px; overflow: hidden; background: #eee; }
  #speedfill { height: 100%; width: 0; background: linear-gradient(90deg, #4caf50, #ffc107 60%, #e53935); }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #panel { background: rgba(255,255,255,.95); border: 3px solid #333; border-radius: 16px; padding: 24px 32px; max-width: 560px; text-align: center; box-shadow: 4px 6px 0 #3334; color: #222; }
  #panel h1 { margin: 0 0 8px; font-size: 40px; color: #1f5fbf; }
  #panel h2 { margin: 0 0 8px; font-size: 30px; }
  #panel p { margin: 8px 0; font-size: 18px; line-height: 1.4; }
  kbd { display: inline-block; border: 2px solid #444; border-bottom-width: 4px; border-radius: 6px; padding: 0 6px; font-family: inherit; background: #fff; min-width: 18px; }
  #help { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #555; font-size: 15px; pointer-events: none; }
  .hidden { display: none !important; }
  #panel { max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; pointer-events: none; }
  #panel.interactive { pointer-events: auto; }
  #panel h1 { margin-bottom: 4px; }
  .mtabs { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 4px 0 10px; }
  #panel button.mt, #panel button.big, #panel button.lv, #panel button.item { pointer-events: auto; font: inherit; cursor: pointer; border: 2px solid #333; border-radius: 10px; background: #fff; color: #333; box-shadow: 2px 3px 0 #3334; }
  #panel button.mt { padding: 5px 10px; font-size: 16px; }
  #panel button.mt.on { background: #1f5fbf; color: #fff; }
  .wallet { font-weight: bold; margin-left: 6px; background: #fff3c4; border: 2px solid #c9a400; border-radius: 10px; padding: 3px 8px; }
  #panel button.big { font-size: 22px; font-weight: bold; padding: 8px 26px; background: #43a047; color: #fff; }
  .lgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 8px; }
  #panel button.lv { padding: 3px 0 1px; font-size: 15px; font-weight: bold; line-height: 1.1; }
  #panel button.lv small { display: block; font-size: 10px; font-weight: normal; white-space: nowrap; overflow: hidden; }
  #panel button.lv.done { background: #e8f5e9; border-color: #43a047; }
  #panel button.lv.sp { border-color: #ff9800; }
  #panel button.lv.on { background: #1f5fbf; color: #fff; }
  .lname { margin: 6px 0 2px; } .best { margin: 2px 0 6px !important; color: #555; }
  table.scores { width: 100%; border-collapse: collapse; font-size: 15px; margin: 6px 0; }
  table.scores td, table.scores th { border-bottom: 1px solid #ccc; padding: 3px 4px; }
  #pname { font: inherit; padding: 3px 8px; border: 2px solid #333; border-radius: 8px; width: 140px; }
  .shop { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #panel button.item { padding: 4px 8px; font-size: 14px; display: flex; flex-direction: column; align-items: center; min-width: 74px; }
  #panel button.item i { width: 26px; height: 14px; border-radius: 4px; border: 1px solid #333; margin-bottom: 2px; }
  #panel button.item small { font-size: 11px; color: #666; }
  #panel button.item.on { border-color: #43a047; background: #e8f5e9; }
  #panel button.item.poor { opacity: .5; }
  #panel h3 { margin: 10px 0 4px; font-size: 17px; }
  #preview { width: 260px; height: 130px; display: block; margin: 0 auto; background: #f4f1e6; border-radius: 12px; border: 2px dashed #bbb; }
  .earned { color: #a67c00; font-weight: bold; }
  @media (max-width: 640px) { .lgrid { grid-template-columns: repeat(5, 1fr); } #panel button.big { font-size: 19px; } }
  #panel button.lvl { pointer-events: auto; font: inherit; font-size: 18px; font-weight: bold; padding: 6px 16px; margin: 4px; border: 3px solid #333; border-radius: 10px; background: #fff; cursor: pointer; color: #333; box-shadow: 2px 3px 0 #3334; }
  #panel button.lvl.on { background: #1f5fbf; color: #fff; }
  #panel .tabs { margin: 6px 0 10px; }
  #panel .tabs::before { content: 'Level'; display: block; font-weight: bold; margin-bottom: 4px; }
  #panel button.lvl.num { min-width: 44px; padding: 6px 0; margin: 3px; }
  #panel .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; text-align: left; font-size: 15px; margin: 8px 0; }
  #panel .legend i { font-style: normal; font-weight: bold; display: inline-block; width: 22px; text-align: center; }
  @media (max-width: 640px) { #panel .legend { grid-template-columns: 1fr; font-size: 13px; gap: 2px; } #panel button.lvl { font-size: 15px; padding: 4px 10px; } }
  #hud .right { display: flex; gap: 8px; align-items: flex-start; }
  #hud button { pointer-events: auto; font: inherit; font-size: 20px; background: rgba(255,255,255,.85); border: 2px solid #444; border-radius: 10px; padding: 4px 10px; box-shadow: 2px 3px 0 #4443; cursor: pointer; color: #333; }
  .pad { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; border: 3px dashed #4447; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 15px; font-weight: bold; color: #444a; pointer-events: none; background: rgba(255,255,255,.35); }
  .pad span { font-size: 34px; line-height: 1; }
  .pad.on { background: rgba(255,255,255,.7); color: #333; border-style: solid; }
  #padBrake { left: 14px; } #padBrake.on { border-color: #e53935; }
  #padGas { right: 14px; } #padGas.on { border-color: #43a047; }
  body:not(.touch) .pad { display: none; }
  body.touch #help { display: none; }
  body:not(.touch) .only-touch, body.touch .only-keys { display: none; }
  @media (max-width: 640px), (max-height: 500px) {
    #hud { top: 8px; left: 8px; right: 8px; font-size: 13px; white-space: nowrap; gap: 6px; }
    #hud .box { padding: 4px 8px; }
    #hud button { font-size: 15px; padding: 3px 8px; }
    #speed { width: 92px; }
    #panel { margin: 0 12px; padding: 16px 18px; }
    #panel h1 { font-size: 30px; } #panel h2 { font-size: 22px; } #panel p { font-size: 15px; }
    .pad { width: 92px; height: 92px; font-size: 12px; } .pad span { font-size: 26px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="box" id="stats">🪙 0/0 · ⏱ 0.0s · 💥 0</div>
  <div class="right">
    <div class="box" id="speed">Tempo: <span id="speedtxt">0</span><div id="speedbar"><div id="speedfill"></div></div></div>
    <button id="mute" title="Ton an/aus (M)">🔊</button>
    <button id="restart" title="Neu starten (R)">↺</button>
  </div>
</div>
<div class="pad" id="padBrake"><span>◀</span>BREMSE</div>
<div class="pad" id="padGas"><span>▶</span>GAS</div>
<div id="overlay"><div id="panel"></div></div>
<div id="help"><kbd>→</kbd>/<kbd>↑</kbd> Gas · <kbd>←</kbd>/<kbd>↓</kbd> Bremse · oder Maus: rechte Hälfte Gas, linke Bremse · <kbd>Enter</kbd> weiter · <kbd>R</kbd> neu · <kbd>M</kbd> Ton</div>
<script>
// Moto Trial — core physics + levels. Works in the browser and in node (for tests).
(function (root) {
  'use strict';

  const G = 1200;            // gravity px/s²
  const GAS = 950;           // engine acceleration
  const BRAKE = 1700;        // brake deceleration
  const ROLL = 40;           // rolling resistance
  const AIR = 7e-4;          // air drag coefficient
  const IMPACT_MAX = 1100;   // max normal speed on landing
  const LAND_ANGLE_MAX = 70 * Math.PI / 180;
  const ASSIST = 1.0;
  const TRAMP_V = 1000;      // trampoline launch speed
  const CONV_ACC = 1500, CONV_MAX = 1250;
  const REV_ACC = 650, REV_MAX = 320;   // reverse gear
  const HEAD = 62, WHEEL_R = 14, WHEEL_X = 26;
  const PI = Math.PI;

  // ---------- path helpers ----------
  // points are [x, y, kind, conveyorDir]; the kind belongs to the segment ending at that point
  function Path(x, y) {
    let kind = 'normal', conv = 0;
    const pts = [[x, y, kind, conv]];
    const step = 7;
    const last = () => pts[pts.length - 1];
    const push = (px, py) => pts.push([px, py, kind, conv]);
    const api = {
      kind(k, c) { kind = k; conv = c || 0; return api; },
      line(x2, y2) {
        const [x1, y1] = last();
        const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
        for (let i = 1; i <= n; i++) push(x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n);
        return api;
      },
      cubic(c1x, c1y, c2x, c2y, x2, y2) {
        const [x0, y0] = last();
        const est = Math.hypot(c1x - x0, c1y - y0) + Math.hypot(c2x - c1x, c2y - c1y) + Math.hypot(x2 - c2x, y2 - c2y);
        const n = Math.max(2, Math.ceil(est / step));
        for (let i = 1; i <= n; i++) {
          const t = i / n, m = 1 - t;
          push(m * m * m * x0 + 3 * m * m * t * c1x + 3 * m * t * t * c2x + t * t * t * x2,
            m * m * m * y0 + 3 * m * m * t * c1y + 3 * m * t * t * c2y + t * t * t * y2);
        }
        return api;
      },
      arc(cx, cy, r, a0, a1) {
        const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) * r / step));
        for (let i = 1; i <= n; i++) {
          const a = a0 + (a1 - a0) * i / n;
          push(cx + r * Math.cos(a), cy + r * Math.sin(a));
        }
        return api;
      },
      fn(x2, f) { // y = f(x) from current x to x2
        const [x1] = last();
        const n = Math.max(2, Math.ceil(Math.abs(x2 - x1) / 6));
        for (let i = 1; i <= n; i++) { const x = x1 + (x2 - x1) * i / n; push(x, f(x)); }
        return api;
      },
      pts,
    };
    return api;
  }

  function fillSegs(g) {
    const segs = [], side = g.side, pts = g.pts;
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by, kind, conv] = pts[i + 1];
      const len = Math.hypot(bx - ax, by - ay);
      if (len < 1e-6) continue;
      const tx = (bx - ax) / len, ty = (by - ay) / len;
      segs.push({ ax, ay, bx, by, len, tx, ty, nx: side * ty, ny: -side * tx, kind, conv });
    }
    g.segs = segs;
  }

  // side: +1 → ground is below the bike while travelling in +x
  function makeGround(pts, side, opts) {
    const g = Object.assign({ pts: pts.map(p => p.slice()), base: pts.map(p => p.slice()), side,
      ox: 0, oy: 0, rot: 0, pivot: [pts[0][0], pts[0][1]], vx: 0, vy: 0 }, opts || {});
    fillSegs(g);
    return g;
  }

  function transformGround(g) {
    const c = Math.cos(g.rot), s = Math.sin(g.rot), [px, py] = g.pivot;
    g.pts = g.base.map(([x, y, k, cv]) => {
      const dx = x - px, dy = y - py;
      return [px + dx * c - dy * s + g.ox, py + dx * s + dy * c + g.oy, k, cv];
    });
    fillSegs(g);
  }

  function groundYAt(g, x) {
    for (const s of g.segs) if ((x - s.ax) * (x - s.bx) <= 0 && Math.abs(s.tx) > 1e-6) return s.ay + (x - s.ax) / s.tx * s.ty;
    return null;
  }

  // shared helpers for level builders
  function ballistic(x, y, vx, vy, spacing, maxN, stopFn, out, drag, gf) {
    let px = x, py = y, acc = spacing * 0.6, n = 0;
    const dt = 1 / 240;
    for (let i = 0; i < 4000 && n < maxN; i++) {
      const nx = px + vx * dt, ny = py + vy * dt;
      vy += G * (gf || 1) * dt;
      if (drag) { const sp = Math.hypot(vx, vy); vx -= AIR * 0.5 * vx * sp * dt; vy -= AIR * 0.5 * vy * sp * dt; }
      acc += Math.hypot(nx - px, ny - py);
      px = nx; py = ny;
      if (stopFn(px, py)) break;
      if (acc >= spacing) { acc = 0; out.push({ x: px, y: py - 32 }); n++; }
    }
  }
  const W = (ax, ay, bx, by) => ({ ax, ay, bx, by });

  // ======================= LEVEL 1 =======================
  function level1() {
    const grounds = [];
    const p0 = Path(-470, 50).line(-270, 50).arc(-270, 400, 350, -PI / 2, -PI / 6).line(380, 825)
      .arc(640, 675, 300, PI * 5 / 6, PI / 2).line(680, 975).cubic(780, 975, 890, 794, 930, 725);
    grounds.push(makeGround(p0.pts, 1));
    const p1 = Path(1437, 1125).cubic(1470, 1260, 1560, 1405, 1775, 1405).line(2400, 1405);
    grounds.push(makeGround(p1.pts, 1));
    const p2 = Path(2600, 1405).line(2600, 1697).arc(2460, 1697, 140, 0, PI / 2).line(2340, 1837)
      .cubic(2300, 1837, 2280, 1780, 2240, 1740);
    grounds.push(makeGround(p2.pts, -1));
    const p3 = Path(2240, 1837).line(1990, 1837).cubic(1960, 1837, 1945, 1795, 1915, 1765);
    grounds.push(makeGround(p3.pts, -1));
    const p4 = Path(1915, 1837).line(1880, 1837).cubic(1850, 1837, 1830, 1772, 1790, 1772)
      .cubic(1750, 1772, 1730, 1837, 1700, 1837).line(1580, 1837).cubic(1545, 1837, 1515, 1815, 1490, 1790);
    grounds.push(makeGround(p4.pts, -1));
    const p5 = Path(1250, 2060).cubic(1238, 2130, 1200, 2200, 1120, 2200).line(560, 2200);
    grounds.push(makeGround(p5.pts, -1));

    const walls = [
      W(930, 733, 930, 975),
      W(1437, 1133, 1437, 1440), W(1437, 1440, 2400, 1440), W(2400, 1411, 2400, 1440),
      W(2240, 1748, 2240, 1837), W(1915, 1773, 1915, 1837),
      W(1490, 1798, 1490, 1870), W(1490, 1870, 2640, 1870),
      W(1250, 2068, 1250, 2320),
    ];

    const coins = [];
    { const s = grounds[0].segs[grounds[0].segs.length - 1], v = 850;
      ballistic(s.bx, s.by, s.tx * v, s.ty * v, 62, 14, (x, y) => y > 1180, coins); }
    for (let x = 1820; x <= 2360; x += 48) coins.push({ x, y: 1405 - 32 });
    ballistic(2400, 1405, 150, 0, 58, 6, (x, y) => y > 1760, coins);
    for (let x = 2440; x >= 2360; x -= 48) coins.push({ x, y: 1837 - 32 });
    { const s = grounds[4].segs[grounds[4].segs.length - 1], v = 440;
      ballistic(s.bx, s.by, s.tx * v, s.ty * v, 52, 8, (x, y) => y > 2090, coins); }
    for (let x = 1100; x >= 960; x -= 48) coins.push({ x, y: 2200 - 32 });

    return {
      name: 'Level 1', start: { gi: 0, x: -420 },
      grounds, walls, coins,
      spikes: [{ x: 2572, y: 1350, w: 56, h: 55, dir: 'up' }],
      gates: [{ x: 2025, w: 50, top: 1445, bottom: 1837, ceiling: 1440 }],
      buttons: [{ x: 2115, w: 95, y: 1837, target: { type: 'gate', i: 0 }, color: '#fdd835' }],
      movers: [], flaps: [], saws: [], fans: [],
      checkpoints: [{ gi: 2, x: 2440, tx: 2560, dir: -1 }],
      finish: { gi: 5, x: 880, dir: -1 },
      deathY: 2450,
      deathRects: [{ x: 930, y: 1460, w: 507, h: 240 }],
      decor: {
        hatch: [[1437, 1405, 963, 35], [2600, 1405, 45, 465], [1490, 1837, 1110, 33], [560, 2200, 690, 120]],
        hatchPolys: [
          { poly: [[1250, 2060], ...p5.pts, [560, 2320], [1250, 2320]], box: [560, 2050, 700, 270] },
          { poly: [...p4.pts.filter(p => p[0] <= 1880 && p[0] >= 1700), [1700, 1837], [1880, 1837]], box: [1690, 1760, 200, 80] },
        ],
        ramps: [
          [[700, 975], ...p0.pts.filter(p => p[0] >= 700), [930, 975]],
          [[1437, 1405], ...p1.pts.filter(p => p[0] <= 1775), [1437, 1405]],
          [[2330, 1837], ...p2.pts.filter(p => p[1] > 1700 && p[0] <= 2330), [2240, 1837]],
          [[1985, 1837], ...p3.pts.filter(p => p[0] <= 1985), [1915, 1837]],
          [[1575, 1837], ...p4.pts.filter(p => p[0] <= 1575), [1490, 1837]],
        ],
        texts: [{ x: -420, y: 0, t: 'START' }],
        warns: [],
        arrows: [{ x: 1995, y: 1610, up: true, untilButton: 0 }],
      },
    };
  }

  // ======================= LEVEL 2 =======================
  function level2() {
    const gr = [];
    const add = (path, side, opts) => { gr.push(makeGround(path.pts, side, opts)); return gr.length - 1; };
    const coins = [];
    const coinRow = (gi, x0, x1, step) => {
      for (let x = x0; step > 0 ? x <= x1 : x >= x1; x += step) { const y = groundYAt(gr[gi], x); if (y != null) coins.push({ x, y: y - 32 }); }
    };

    // ---- Row A (→): waves, conveyor, trampolines, shaft
    const a0 = add(Path(0, 0).line(250, 0).cubic(350, 0, 400, 150, 520, 150).cubic(640, 150, 700, 60, 820, 60).line(900, 60)
      .kind('conv', 1).cubic(1150, 90, 1400, 40, 1650, 40)
      .kind('normal').line(2150, 40).cubic(2300, 40, 2330, 280, 2470, 280).line(2500, 280)
      .kind('tramp').line(2580, 280), 1);
    const a1 = add(Path(3100, 280).line(3600, 280).kind('tramp').line(3680, 280).kind('normal').line(4320, 280), 1);

    // ---- Row B (←): button + elevator, conveyor + magnet loop, spike-bowl jump, folding bridges
    const b0 = add(Path(4640, 1000).line(3700, 1000), -1);
    const bLift = add(Path(3700, 1001).line(3500, 1001), -1, { color: '#ff8a3d' });
    const b1 = add(Path(3500, 1002).line(3420, 1002).kind('conv', 1).line(3150, 1002).kind('normal').line(2950, 1002)
      .kind('magnet').arc(2950, 822, 180, PI / 2, PI * 5 / 2).kind('normal').line(2700, 1002)
      .cubic(2650, 1002, 2635, 980, 2600, 960), -1);
    const b2 = add(Path(2350, 990).cubic(2300, 995, 2250, 1002, 2200, 1002).line(2050, 1002), -1);
    const flapG = [];
    for (let i = 0; i < 3; i++) {
      const x0 = 2050 - i * 200, y = 1003 + i;
      flapG.push(add(Path(x0, y).line(x0 - 200, y), -1, { color: '#8bc34a', pivot: [x0, y] }));
    }
    const b3 = add(Path(1450, 1006).line(1000, 1006), -1);

    // ---- Row C (→): bowl, saws, trampoline over saw, moving platform
    const c0 = add(Path(800, 1006).line(800, 1297).arc(940, 1297, 140, PI, PI / 2).line(2200, 1437)
      .kind('tramp', 750).line(2280, 1437).kind('normal').line(3000, 1437), 1);
    const cMove = add(Path(3000, 1438).line(3260, 1438), 1, { color: '#9c4dcc' });
    const c1 = add(Path(3500, 1439).line(3900, 1439).cubic(4100, 1439, 4250, 1950, 4600, 1950).line(4800, 1950)
      // ---- Row D (→): bumps under a spike ceiling, spiked stairs, conveyor + trampoline to the finish
      .fn(6000, x => 1950 - 16 * (1 - Math.cos(2 * PI * (x - 4800) / 220)))
      .line(6250, 1950), 1);
    let sp = Path(6250, 1950);
    for (let i = 0; i < 6; i++) { const y = 1950 + 70 * (i + 1); sp.line(6250 + 200 * i, y).line(6250 + 200 * (i + 1), y); }
    sp.line(7500, 2370).kind('conv', 1).line(7650, 2370).kind('tramp').line(7730, 2370).kind('normal').line(7750, 2370);
    const d1 = add(sp, 1);
    const d2 = add(Path(8050, 2140).line(9300, 2140), 1);

    const walls = [
      W(2580, 286, 2580, 520), W(3100, 286, 3100, 520),
      W(4320, 286, 4320, 820), W(4640, 0, 4640, 1000),
      W(3700, 1006, 3700, 1350), W(3500, 1008, 3500, 1350),
      W(2600, 968, 2600, 1120), W(2350, 996, 2350, 1120),
      W(2050, 1009, 2050, 1170), W(1450, 1012, 1450, 1170),
      W(3000, 1443, 3000, 1700), W(3500, 1445, 3500, 1700),
      W(8050, 2146, 8050, 2400)
    ];

    const spikes = [
      { x: 2600, y: 455, w: 480, h: 50, dir: 'up' },          // pit under trampoline 1
      { x: 3760, y: 160, w: 60, h: 120, dir: 'up' },          // spike block between trampolines
      { x: 4600, y: 380, w: 40, h: 520, dir: 'left' },        // shaft wall
      { x: 2360, y: 1065, w: 230, h: 50, dir: 'up' },         // spike bowl
      { x: 1460, y: 1105, w: 580, h: 45, dir: 'up' },         // under folding bridges

  // ======================= SECTION BUILDER (levels 3+) =======================
  // Every section travels to the right (+x). Each method appends to the current path or
  // starts a new one, and records hints (ideal speeds) used by the test bot.
  function Builder(name) {
    const B = {
      name, gr: [], walls: [], spikes: [], coins: [], saws: [], fans: [], flaps: [], movers: [], buttons: [],
      portals: [], waters: [], checkpoints: [], hints: [], deathRects: [], finish: null, start: null,
      decor: { hatch: [], hatchPolys: [], ramps: [], texts: [], warns: [], arrows: [], skirt: true },
      p: null, pending: [], deathY: 0,
    };
    const last = () => B.p.pts[B.p.pts.length - 1];
    const X = () => last()[0], Y = () => last()[1];
    const later = f => B.pending.push(f);
    const hint = h => { if (B.guard !== undefined) h.x0 = Math.max(h.x0, B.guard); B.hints.push(h); later(gi => { if (h.gi === undefined) h.gi = gi; }); return h; };
    const coinsFlat = (x0, x1, y, step) => { for (let x = x0 + step / 2; x < x1; x += step) B.coins.push({ x, y: y - 32 }); };
    const pit = (x0, x1, y, depth, lava) => {
      B.walls.push(W(x0, y + 8, x0, y + depth), W(x1, y + 8, x1, y + depth));
      if (lava || B.lavaPits) B.spikes.push({ x: x0, y: y + depth - 70, w: x1 - x0, h: 70, dir: 'lava' });
      else B.spikes.push({ x: x0 + 6, y: y + depth - 45, w: x1 - x0 - 12, h: 45, dir: 'up' });
      B.decor.hatch.push([x0 - 25, y, 25, depth + 25], [x1, y, 25, depth + 25], [x0 - 25, y + depth, x1 - x0 + 50, 25]);
    };
    // ideal launch speed so that the ballistic path (with drag) lands at targetX on height landY
    const idealSpeed = (x, y, dx, dy, landY, targetX, fixedVy, gf) => {
      const landsAt = v => {
        let px = x, py = y, vx = fixedVy !== undefined ? v : dx * v, vy = fixedVy !== undefined ? fixedVy : dy * v;
        for (let i = 0; i < 4000; i++) {
          const dt = 1 / 240; vy += G * (gf || 1) * dt; const sp = Math.hypot(vx, vy);
          vx -= AIR * 0.5 * vx * sp * dt; vy -= AIR * 0.5 * vy * sp * dt;
          px += vx * dt; py += vy * dt;
          if (vy > 0 && py >= landY) return px;
        }
        return px;
      };
      let lo = 50, hi = 3000;
      for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (landsAt(m) < targetX) lo = m; else hi = m; }
      return lo;
    };

    B.begin = (x, y) => { B.p = Path(x, y); return B; };
    B.end = () => {
      if (B.p && B.p.pts.length > 1) {
        B.gr.push(makeGround(B.p.pts, 1));
        const gi = B.gr.length - 1;
        for (const f of B.pending) f(gi);
        B.deathY = Math.max(B.deathY, ...B.p.pts.map(p => p[1] + 700));
      }
      B.p = null; B.pending = [];
      return B.gr.length - 1;
    };
    B.startHere = text => { const x = X(), y = Y(); B.start = { x: x + 60 }; later(gi => (B.start.gi = gi)); B.decor.texts.push({ x: x + 60, y: y - 70, t: text || 'START' }); return B; };
    B.flat = (len, coinStep) => { const x = X(), y = Y(); B.p.line(x + len, y); if (coinStep) coinsFlat(x, x + len, y, coinStep); return B; };
    B.slope = (dx, dy) => { const x = X(), y = Y(); B.p.cubic(x + dx * 0.45, y, x + dx * 0.55, y + dy, x + dx, y + dy); return B; };
    B.waves = (len, amp, wl) => {
      const x = X(), y = Y();
      B.p.fn(x + len, xx => y - amp * (1 - Math.cos(2 * PI * (xx - x) / wl)) / 2);
      for (let c = x + wl / 2; c < x + len; c += wl) B.coins.push({ x: c, y: y - amp - 34 });
      return B;
    };
    B.conv = len => { const x = X(), y = Y(); B.p.kind('conv', 1).line(x + len, y).kind('normal'); hint({ x0: x - 100, x1: x + len, max: true }); return B; };
    B.tramp = (len, power) => { const x = X(), y = Y(); B.p.kind('tramp', power || 0).line(x + (len || 80), y).kind('normal'); return B; };
    B.loop = (r, magnet) => {
      const x = X(), y = Y();
      hint({ x0: x - 500, x1: x + r + 10, max: true });
      B.p.kind(magnet ? 'magnet' : 'loop').arc(x, y - r, r, PI / 2, PI / 2 - 2 * PI).kind('normal');
      for (let a = -PI * 0.75; a < PI * 0.8; a += PI / 5) B.coins.push({ x: x + (r - 45) * Math.cos(a - PI / 2), y: y - r + (r - 45) * Math.sin(a - PI / 2) });
      if (B.special) B.coins.push({ x, y: y - 2 * r + 45, v: 5 });
      return B;
    };
    B.kickerGap = o => {
      o = Object.assign({ h: 50, angle: 40, gap: 260, drop: 0, landLen: 320, depth: 220, g: 1 }, o);
      const x = X(), y = Y(), A = o.angle * PI / 180, Lk = 130;
      const tx = x + Lk, ty = y - o.h;
      B.p.cubic(x + Lk * 0.4, y, tx - 40 * Math.cos(A), ty + 40 * Math.sin(A), tx, ty);
      const kick = B.p.pts.filter(p => p[0] >= x);
      B.decor.ramps.push([[x + 20, y], ...kick, [tx, y]]);
      const s = { tx: Math.cos(A), ty: -Math.sin(A) };
      let lx = tx + o.gap, ly = y + o.drop;
      let v = idealSpeed(tx, ty, s.tx, s.ty, ly, lx + o.landLen * 0.3, undefined, o.g);
      // keep the jump reachable: shrink the gap until the needed run-up speed is realistic
      const appr = vv => Math.sqrt(vv * vv + 2 * G * o.h + 2 * (ROLL + AIR * vv * vv) * Lk * 1.2) * 1.02;
      while (B.maxApproach && appr(v) > B.maxApproach && o.gap > 200) {
        o.gap -= 20; lx = tx + o.gap; v = idealSpeed(tx, ty, s.tx, s.ty, ly, lx + o.landLen * 0.3, undefined, o.g);
      }
      hint({ x0: x - 1000, x1: x - 5, kick: true, v: Math.sqrt(v * v + 2 * G * o.h + 2 * (ROLL + AIR * v * v) * Lk * 1.2) * 1.02 });
      hint({ x0: x - 5, x1: tx + 1, coast: true });
      const arc = [];
      ballistic(tx, ty, s.tx * v, s.ty * v, o.g < 1 ? 90 : 60, 24, (px, py) => py > ly - 5 && px > lx, arc, true, o.g);
      if (B.special && arc.length) { const top = arc.reduce((a, c) => (c.y < a.y ? c : a)); top.v = 5; }
      B.coins.push(...arc);
      if (o.ceiling !== false) { // spike ceiling just above the ideal flight path: too much speed = too high
        const margin = B.ceilMargin !== undefined ? B.ceilMargin : 28;
        let peak = ty, px = tx, vx = s.tx * v, vy = s.ty * v;
        for (let i = 0; i < 4000 && vy < 0; i++) { const d = 1 / 240; vy += G * o.g * d; const sp = Math.hypot(vx, vy); vx -= AIR * 0.5 * vx * sp * d; vy -= AIR * 0.5 * vy * sp * d; px += vx * d; peak += vy * d; }
        const cy = peak - HEAD - margin - 70 * (1 - o.g);
        B.spikes.push({ x: tx + 30, y: cy - 45, w: o.gap + 120, h: 45, dir: 'down' });
        B.decor.hatch.push([tx + 30, cy - 75, o.gap + 120, 30]);
      }
      if (o.g < 1) B.lowG.push({ x: tx - 20, y: Math.min(...arc.map(c => c.y)) - 400, w: o.gap + o.landLen * 0.8, h: 2000, g: o.g });
      B.end();
      B.walls.push(W(tx, ty + 8, tx, y + o.depth));
      pit(tx, lx, Math.max(y, ly), o.depth, o.lava);
      B.begin(lx, ly).flat(o.landLen);
      return B;
    };
    B.trampGap = o => {
      o = Object.assign({ gap: 420, power: 900, landLen: 380, depth: 220, g: 1 }, o);
      B.flat(60);
      const x = X(), y = Y();
      B.tramp(80, o.power);
      const ex = X(), lx = ex + o.gap;
      const v = idealSpeed(x + 2, y, 0, 0, y, lx + o.landLen * 0.35, -o.power, o.g);
      hint({ x0: x - 400, x1: ex, v });
      const arc = [];
      ballistic(x + 2, y, v, -o.power, o.g < 1 ? 95 : 70, 24, (px, py) => py > y - 5 && px > lx, arc, true, o.g);
      B.coins.push(...arc);
      if (o.g < 1) B.lowG.push({ x: x - 10, y: Math.min(...arc.map(c => c.y)) - 400, w: o.gap + 140 + o.landLen * 0.8, h: 2000, g: o.g });
      B.end();
      pit(ex, lx, y, o.depth, o.lava);
      B.begin(lx, y).flat(o.landLen);
      return B;
    };
    B.saws = (len, n, style) => {
      const x = X(), y = Y(), idx = [];
      for (let i = 0; i < n; i++) {
        idx.push(B.saws_.length);
        B.saws_.push({ cx: x + len * (i + 1) / (n + 1), cy: y - 147, orbit: 85, r: 36, speed: 1.8, phase: i * PI, style });
      }
      hint({ x0: x - 200, x1: x + len, saw: idx, v: 300 });
      B.decor.warns.push({ x: x - 60, y: y - 120 });
      return B.flat(len, 110);
    };
    B.spikeWheel = len => {
      const x = X(), y = Y(), i = B.saws_.length;
      B.saws_.push({ cx: x + len / 2, cy: y - 175, orbit: 95, r: 52, speed: 1.5, phase: 0, style: 'spike' });
      hint({ x0: x - 200, x1: x + len, saw: [i], v: 300 });
      return B.flat(len, 120);
    };
    B.flapsBridge = (n, w) => {
      n = n || 3; w = w || 200;
      const x = X(), y = Y();
      hint({ x0: x - 350, x1: x, v: 650 });
      B.end();
      for (let i = 0; i < n; i++) {
        const x0 = x + i * w, yy = y + 1 + i;
        B.gr.push(makeGround(Path(x0, yy).line(x0 + w, yy).pts, 1, { color: '#8bc34a', pivot: [x0, yy] }));
        const gi = B.gr.length - 1;
        B.flaps.push({ gi, dir: 1, delay: 0.4 });
        B.hints.push({ gi, x0, x1: x0 + w, v: 650 });
        coinsFlat(x0, x0 + w, yy, 100);
      }
      pit(x, x + n * w, y, 160);
      B.begin(x + n * w, y + n + 1).flat(250);
      return B;
    };
    B.stairs = (n, w, h) => {
      n = n || 5; w = w || 200; h = h || 70;
      const x = X(), y = Y();
      hint({ x0: x - 250, x1: x + n * w, v: 420 });
      B.decor.warns.push({ x: x - 50, y: y - 60 });
      for (let i = 0; i < n; i++) {
        const yy = y + h * (i + 1);
        B.p.line(x + w * i, yy).line(x + w * (i + 1), yy);
        B.spikes.push({ x: x + w * i, y: yy - 26, w: 60, h: 26, dir: 'up' });
        B.coins.push({ x: x + w * i + 130, y: yy - 32 });
      }
      return B;
    };
    B.ceilBumps = len => {
      const x = X(), y = Y();
      hint({ x0: x - 200, x1: x + len, v: 420 });
      B.waves(len, 32, 220);
      B.spikes.push({ x: x + 50, y: y - 32 - 62 - 58, w: len - 100, h: 45, dir: 'down' });
      B.decor.hatch.push([x + 50, y - 32 - 62 - 88, len - 100, 30]);
      return B;
    };
    B.pool = (len, depth, withTramp) => {
      if (withTramp) {
        B.flat(60);
        const tx = X(), ty = Y();
        hint({ x0: tx - 350, x1: tx, v: idealSpeed(tx + 2, ty, 0, 0, ty, tx + 80 + len + 150, -800) });
        B.tramp(80, 800);
      }
      const x = X(), y = Y();
      const run = Math.max(210, depth * 2.2);
      B.p.cubic(x + run * 0.5, y, x + run * 0.5, y + depth, x + run, y + depth).line(x + len - run, y + depth).cubic(x + len - run * 0.5, y + depth, x + len - run * 0.5, y, x + len, y);
      B.waters.push({ x: x + 10, y: y - 6, w: len - 20, h: depth + 6, poly: [[x, y - 6], ...B.p.pts.filter(q => q[0] >= x && q[0] <= x + len), [x + len, y - 6]] });
      if (!withTramp) hint({ x0: x - 100, x1: x + len, max: true });
      coinsFlat(x + run, x + len - run, y + depth, 90);
      return B;
    };
    B.elevator = h => {
      h = h || 420;
      const x = X(), y = Y();
      B.end();
      const pw = 200;
      B.gr.push(makeGround(Path(x - 8, y + 1).line(x + 4 + pw, y + 1).pts, 1, { color: '#ff8a3d' }));
      const gi = B.gr.length - 1, mi = B.movers.length;
      B.movers.push({ gi, from: [0, 0], to: [0, -h], speed: 150, mode: 'loop', dwell: 1.4 });
      B.hints.push({ gi, x0: x, x1: x + pw + 10, mover: mi, ride: true });
      B.hints.push({ gi: B.gr.length - 2, x0: x - 300, x1: x + 5, mover: mi, board: x });
      B.walls.push(W(x + pw + 8, y - h + 8, x + pw + 8, y + 200));
      B.decor.hatch.push([x + pw + 8, y - h, 30, h + 220], [x - 25, y, 25, 220]);
      B.spikes.push({ x: x + 10, y: y + 160, w: pw - 10, h: 40, dir: 'up' });
      B.decor.hatch.push([x, y + 200, pw + 30, 20]);
      B.begin(x + pw + 8, y - h + 2).flat(250);
      return B;
    };
    B.moverPit = () => {
      const x = X(), y = Y();
      B.end();
      const pw = 260, gap = 500;
      B.gr.push(makeGround(Path(x - 8, y + 1).line(x + pw, y + 1).pts, 1, { color: '#9c4dcc' }));
      const gi = B.gr.length - 1, mi = B.movers.length;
      B.movers.push({ gi, from: [0, 0], to: [gap - pw, 0], speed: 120, mode: 'loop', dwell: 1.2 });
      B.hints.push({ gi, x0: x, x1: x + gap, mover: mi, ride: true });
      B.hints.push({ gi: B.gr.length - 2, x0: x - 300, x1: x + 5, mover: mi, board: x });
      B.deathRects.push({ x, y: y + 80, w: gap, h: 400 });
      B.decor.hatch.push([x - 25, y, 25, 200], [x + gap, y, 25, 200]);
      coinsFlat(x + 60, x + gap - 60, y, 120);
      B.begin(x + gap, y + 2).flat(250);
      return B;
    };
    B.shaftDown = depth => {
      depth = depth || 650;
      const x = X(), y = Y(), w = 320;
      hint({ x0: x - 300, x1: x, v: 150 });
      B.decor.warns.push({ x: x - 120, y: y - 80 });
      B.end();
      B.walls.push(W(x + w, y - 250, x + w, y + depth - 210), W(x, y + 8, x, y + depth));
      B.spikes.push({ x: x + w - 40, y: y - 150, w: 40, h: depth - 120, dir: 'left' });
      B.fans.push({ x, y: y + depth - 400, w, h: 400, vt: 180 });
      B.decor.hatch.push([x + w, y - 250, 40, depth + 40], [x - 40, y + 6, 40, depth]);
      ballistic(x, y, 140, 0, 70, 7, (px, py) => py > y + depth - 100, B.coins, true);
      B.begin(x, y + depth).flat(w + 300);
      return B;
    };
    B.drop = depth => {
      depth = depth || 480;
      const x = X(), y = Y();
      hint({ x0: x - 300, x1: x, v: 200 });
      B.end();
      B.decor.hatch.push([x - 30, y, 30, depth]);
      ballistic(x, y, 200, 0, 70, 6, (px, py) => py > y + depth - 60, B.coins, true);
      B.begin(x + 20, y + depth); B.p.kind('soft').line(x + 380, y + depth).kind('normal'); B.flat(200);
      return B;
    };
    B.fanUp = h => {
      h = h || 380;
      const x = X(), y = Y(), w = 300;
      hint({ x0: x - 300, x1: x + w, v: 140 });
      B.end();
      B.fans.push({ x, y: y - h - 130, w, h: h + 380, vt: -330, up: true });
      B.walls.push(W(x + w, y - h + 8, x + w, y + 260));
      B.spikes.push({ x: x + 5, y: y + 215, w: w - 10, h: 45, dir: 'up' });
      B.decor.hatch.push([x + w, y - h, 40, h + 300], [x - 25, y, 25, 300], [x, y + 260, w, 25]);
      for (let k = 0; k < 5; k++) B.coins.push({ x: x + 60 + k * 40, y: y - 60 - k * (h / 5) });
      B.begin(x + w, y - h + 2).flat(300);

    };
    B.portalTo = (nx, ny, color) => {
      const x = X(), y = Y();
      B.flat(260);
      B.portals.push({ ax: x + 160, ay: y - 38, bx: nx + 70, by: ny - 2, color });
      B.walls.push(W(x + 262, y - 200, x + 262, y));
      B.decor.hatch.push([x + 262, y - 200, 25, 225]);
      B.end();
      B.begin(nx, ny).flat(60);
      B.decor.hatch.push([nx - 25, ny - 200, 25, 225]);

    };
    B.magnetHump = (h, len) => {
      const x = X(), y = Y();
      hint({ x0: x - 200, x1: x + len, v: 650 });
      B.p.kind('magnet').cubic(x + len * 0.3, y, x + len * 0.25, y - h, x + len * 0.5, y - h)
        .cubic(x + len * 0.75, y - h, x + len * 0.7, y, x + len, y).kind('normal');
      B.coins.push({ x: x + len * 0.5, y: y - h - 34 }, { x: x + len * 0.35, y: y - h * 0.7 - 34 }, { x: x + len * 0.65, y: y - h * 0.7 - 34 });

    };

  // ---------- geometry ----------
  function segIntersect(px, py, qx, qy, s) {

  // ---------- game ----------
  function createGame(levelIndex) {

    function placeOnGround(gi, x) {

    function resetDynamic() {

    function reset(full) {

    function crash(msg) {

    }

    function bikePoints() {

    function takeoff(vx, vy) {

    function stepGround(dt, inp) {

  // ---------- overlay ----------

  function garageHtml() {

  function bindMenu(p) {

  }
  function nextLevel() {

  }
  function recordFinish() {

  }
  function updatePanel() {

      p.innerHTML = `<h2>💥 ${S.msg}</h2>
        <p><span class="only-keys"><kbd>Enter</kbd></span><span class="only-touch">Tippen:</span> ${S.checkpoint ? 'weiter ab Checkpoint 🚩' : 'nochmal versuchen'} &nbsp; · &nbsp; <span class="only-keys"><kbd>R</kbd></span><span class="only-touch">↺ oben rechts:</span> ganz neu starten</p>`;
    } else if (S.status === 'finish') {
      if (!finishedRecord) recordFinish();
      const { rank, r } = finishedRecord, tot = total();
      const hasNext = levelIndex + 1 < MotoTrial.levelCount;
      p.innerHTML = `<h1>🏁 Ziel!</h1>
        <p style="font-size:24px">🪙 ${r.score} / ${tot} ${r.score === tot ? '– <b>alle!</b> 🌟' : ''}</p>
        <p>⏱ ${r.time.toFixed(2)} s &nbsp; · &nbsp; 💥 ${r.deaths} Crashs</p>
        <p>${rank === 0 ? '🏆 Neuer Rekord!' : rank > 0 ? `Platz ${rank + 1} in der Bestenliste` : `Rekord: 🪙 ${bestOf(levelIndex).score} in ${fmt(bestOf(levelIndex).time)}`}</p>
        <p class="earned">+${lastEarned} 🪙 für die Garage (jetzt ${profile.wallet})</p>
        <p>${hasNext ? `<button class="big" id="nextLevel">▶ Level ${levelIndex + 2} <span class="only-keys">(Enter)</span></button>` : '<b>🎉 Du hast alle Level geschafft!</b>'}</p>
        <p><button class="mt" id="replay">↺ Nochmal</button> <button class="mt" id="toMenu">☰ Menü</button></p>`;

  }
  updatePanel();

  // ---------- events → effects ----------
  function handleEvents() {
    for (const e of S.events) {
      const P = game.bikePoints();
      if (e === 'coin') { blip(880 + Math.random() * 200, 0.12, 'square', 0.05); setTimeout(() => blip(1320, 0.1, 'square', 0.04), 60);
        for (let i = 0; i < 8; i++) particles.push({ x: P.center[0], y: P.center[1], vx: (Math.random() - .5) * 300, vy: (Math.random() - .8) * 300, life: .5, c: '#f5b800', r: 4 }); }
      if (e === 'land') { shake = Math.max(shake, 4); dust(P.pos, 10); }
      if (e === 'button') { blip(300, 0.15, 'triangle', 0.15); setTimeout(() => blip(600, 0.25, 'triangle', 0.12), 120); }
      if (e === 'checkpoint') { blip(660, 0.15, 'sine', 0.1); setTimeout(() => blip(990, 0.25, 'sine', 0.1), 120); }
      if (e === 'crash') {
        shake = 18; flash = 1; blip(90, 0.5, 'sawtooth', 0.2);
        crashBike = { x: S.x, y: S.y, vx: (S.mode === 'air' ? S.vx : S.vx) * 0.4, vy: -350, theta: S.theta, om: (Math.random() < .5 ? -1 : 1) * 9, facing: S.facing, t: 0 };
        for (let i = 0; i < 24; i++) particles.push({ x: P.center[0], y: P.center[1], vx: (Math.random() - .5) * 700, vy: (Math.random() - .7) * 600, life: .8, c: i % 2 ? '#e53935' : '#ffb300', r: 4 });
        crashAt = performance.now(); pointers.clear(); setTimeout(() => { syncKeys(); updatePanel(); }, 400);
      }
      if (e === 'finish') { blip(523, .15, 'square', .08); setTimeout(() => blip(659, .15, 'square', .08), 150); setTimeout(() => blip(784, .3, 'square', .08), 300); updatePanel(); }
    }
    S.events.length = 0;
  }
  function dust(p, n) {
    for (let i = 0; i < n; i++) particles.push({ x: p[0], y: p[1] - 4, vx: (Math.random() - .5) * 200, vy: -Math.random() * 120, life: .5, c: '#9e9e9e', r: 5 });
  }

  // ---------- loop ----------
  let lastT = performance.now(), acc = 0;
  const DT = 1 / 240;
  function frame(now) {
    let d = Math.min(0.05, (now - lastT) / 1000); lastT = now; clock += d;
    acc += d;
    while (acc >= DT) { game.step(DT, keys); acc -= DT; handleEvents(); }
    // effects
    if (S.status === 'run' && S.mode === 'ground' && (keys.up || (keys.down && Math.abs(S.v) > 80)) && Math.random() < 0.5) {
      const P = game.bikePoints(); dust([P.rear[0], P.rear[1] + 10], 1);
    }
    for (const p of particles) { p.x += p.vx * d; p.y += p.vy * d; p.vy += 900 * d; p.life -= d; }
    particles = particles.filter(p => p.life > 0);
    if (crashBike) { crashBike.t += d; crashBike.vy += 1200 * d; crashBike.x += crashBike.vx * d; crashBike.y += crashBike.vy * d; crashBike.theta += crashBike.om * d; }
    shake *= Math.pow(0.02, d); flash = Math.max(0, flash - d * 2);
    // engine sound
    if (engGain && !muted) {
      const sp = S.mode === 'ground' ? Math.abs(S.v) : Math.hypot(S.vx, S.vy) * 0.6;
      const running = S.status === 'run';
      eng.frequency.setTargetAtTime(45 + sp * 0.09 + (keys.up ? 25 : 0), ac.currentTime, 0.05);
      engGain.gain.setTargetAtTime(running ? (keys.up ? 0.05 : 0.025) : 0, ac.currentTime, 0.08);
    }
    // camera
    const lookX = (S.mode === 'ground' ? S.v * (L.grounds[S.gi].segs[S.si].tx) : S.vx) * 0.25;
    const lookY = (S.mode === 'ground' ? 0 : S.vy * 0.15);
    const tx = (crashBike ? crashBike.x : S.x) + Math.max(-260, Math.min(260, lookX));
    const ty = (crashBike ? Math.min(crashBike.y, S.y + 200) : S.y) - 80 + Math.max(-150, Math.min(200, lookY));
    const k = 1 - Math.pow(0.004, d);
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
    if (S.status === 'ready') { cam.x = S.x + 150; cam.y = S.y + 60; }
    draw();
    hud();
    if (S.status === 'ready' && menuTab === 'garage') drawPreview();
    requestAnimationFrame(frame);
  }

  // ---------- drawing ----------
  function hatchRect(x, y, w, h) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = TH.hatchBg; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = TH.hatchLine; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = -h; i < w; i += 9) { ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); }
    ctx.stroke(); ctx.restore();
  }
  function polyPath(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); }

  const PI2 = Math.PI * 2;
  function groundY(g, x) {
    for (const s of g.segs) if ((x - s.ax) * (x - s.bx) <= 0 && Math.abs(s.tx) > 1e-6) return s.ay + (x - s.ax) / s.tx * s.ty;
    return g.segs[0].ay;
  }
  function drawSpikes(s) {
    const n = Math.max(1, Math.round((s.dir === 'up' || s.dir === 'down' ? s.w : s.h) / 22));
    if (s.dir === 'lava') {
      ctx.save();
      const gr = ctx.createLinearGradient(0, s.y, 0, s.y + s.h); gr.addColorStop(0, '#ffca28'); gr.addColorStop(0.4, '#ff5722'); gr.addColorStop(1, '#b71c1c');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(s.x, s.y + s.h);
      for (let x = s.x; x <= s.x + s.w; x += 10) ctx.lineTo(x, s.y + 8 + Math.sin(x * 0.04 + clock * 3) * 5);
      ctx.lineTo(s.x + s.w, s.y + s.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,235,59,.8)';
      for (let k = 0; k < s.w / 60; k++) { const bx = s.x + ((k * 53 + clock * 20) % s.w), by = s.y + 20 + ((k * 31 + clock * 15) % (s.h - 25)); ctx.beginPath(); ctx.arc(bx, by, 3 + (k % 3), 0, PI2); ctx.fill(); }

      ctx.beginPath();

    }
  }
  const THEMES = {
    paper: { bg: '#fbfaf4', lines: '#b8c6e8', ground: '#3d3d3d', text: '#333', hatchBg: '#e9e6dc', hatchLine: '#6668' },
    night: { bg: '#141a33', lines: '#26305a', ground: '#d7dcef', text: '#e8ecff', hatchBg: '#222a4d', hatchLine: '#5a66a088' },
  };
  let TH = THEMES.paper, hatchTheme = null;
  let hatchPat = null;
  function makeHatch() {
    const c = document.createElement('canvas'); c.width = c.height = 12;
    const g = c.getContext('2d'); g.fillStyle = TH.hatchBg; g.fillRect(0, 0, 12, 12);
    g.strokeStyle = TH.hatchLine; g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, 12); g.lineTo(12, 0); g.moveTo(-6, 6); g.lineTo(6, -6); g.moveTo(6, 18); g.lineTo(18, 6); g.stroke();
    return ctx.createPattern(c, 'repeat');
  }
  function drawBalloon(x, y, sx, sy) {
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(x + 8, (y + sy) / 2, x, y + 30); ctx.stroke();
    ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.ellipse(x, y, 24, 30, 0, 0, PI2); ctx.fill();
    ctx.fillStyle = '#ffffff88'; ctx.beginPath(); ctx.ellipse(x - 8, y - 10, 6, 10, -0.4, 0, PI2); ctx.fill();
    ctx.fillStyle = '#b71c1c'; ctx.beginPath(); ctx.moveTo(x - 5, y + 32); ctx.lineTo(x + 5, y + 32); ctx.lineTo(x, y + 27); ctx.fill();
  }
  function drawBubble(x, y, r) {

    const sw = w / n;

      ctx.moveTo(x + i * sw, y); ctx.lineTo(x + i * sw + sw / 2, y + dir * h); ctx.lineTo(x + (i + 1) * sw, y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    TH = THEMES[L.theme] || THEMES.paper;
    if (hatchTheme !== TH) { hatchPat = null; hatchTheme = TH; }
    document.body.style.background = TH.bg;
    ctx.fillStyle = TH.bg; ctx.fillRect(0, 0, W, H);
    if (L.theme === 'night') { // stars + moon, slight parallax
      for (let i = 0; i < 90; i++) {
        const sx2 = ((i * 397.3 - cam.x * 0.05) % W + W) % W, sy2 = ((i * 211.7 - cam.y * 0.05) % H + H) % H;
        ctx.fillStyle = `rgba(255,255,255,${0.35 + (i % 5) * 0.12 + Math.sin(clock * 2 + i) * 0.1})`;
        ctx.fillRect(sx2, sy2, i % 7 ? 2 : 3, i % 7 ? 2 : 3);
      }
      ctx.fillStyle = '#f5f1d6'; ctx.beginPath(); ctx.arc(W - 90, 120, 44, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e2dcb8'; ctx.beginPath(); ctx.arc(W - 104, 108, 9, 0, Math.PI * 2); ctx.arc(W - 76, 134, 6, 0, Math.PI * 2); ctx.fill();
    }
    const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
    const vx0 = cam.x - W / 2 / zoom, vy0 = cam.y - H / 2 / zoom, vw = W / zoom, vh = H / zoom;
    ctx.setTransform(DPR * zoom, 0, 0, DPR * zoom, DPR * (W / 2 + sx) - DPR * zoom * cam.x, DPR * (H / 2 + sy) - DPR * zoom * cam.y);

    ctx.strokeStyle = TH.lines; ctx.lineWidth = 2; ctx.beginPath();

    ctx.stroke();

    const D = L.decor;

      if (f.taken) continue;
      const bob = Math.sin(clock * 2 + f.x) * 6;
      if (f.kind === 'balloon') drawBalloon(f.x, f.y - 40 + bob, f.x, f.y + 20);
      else drawBubble(f.x, f.y + bob, 34);
    }

    // portals
    for (const pt of L.portals) {
      for (const [x, y, k] of [[pt.ax, pt.ay, 1], [pt.bx, pt.by - 36, -1]]) {
        ctx.save(); ctx.translate(x, y);
        ctx.strokeStyle = pt.color; ctx.lineWidth = 3; ctx.beginPath();
        for (let i = 0; i < 10; i++) { const a = i * PI2 / 10 + clock * 0.8; ctx.moveTo(Math.cos(a) * 44, Math.sin(a) * 58); ctx.lineTo(Math.cos(a) * 54, Math.sin(a) * 70); }
        ctx.stroke();
        ctx.globalAlpha = 0.85; ctx.fillStyle = pt.color; ctx.beginPath(); ctx.ellipse(0, 0, 34, 48, 0, 0, PI2); ctx.fill();
        ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(0, 0, 26 - i * 8, 38 - i * 11, k * clock * (2 + i), 0, Math.PI * 1.3); ctx.stroke(); }
        ctx.restore();
      }
    }

    // coins
    for (const c of coins) {
      if (c.taken || c.x < vx0 - 30 || c.x > vx0 + vw + 30) continue;
      const sxk = Math.abs(Math.cos(clock * 3 + c.x * 0.01)) * 0.75 + 0.25;
      ctx.save(); ctx.translate(c.x, c.y);
      if (c.v > 1) { // star coin, worth more
        ctx.rotate(Math.sin(clock * 2 + c.x) * 0.3); ctx.scale(1.15 + Math.sin(clock * 5) * 0.08, 1.15 + Math.sin(clock * 5) * 0.08);
        ctx.fillStyle = '#ff9800'; ctx.strokeStyle = '#e65100'; ctx.lineWidth = 3; ctx.beginPath();
        for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 9 : 21; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(c.v, 0, 5);
        ctx.restore(); continue;
      }
      ctx.scale(sxk, 1);
      ctx.fillStyle = '#f5c400'; ctx.strokeStyle = '#8a6d00'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, 0, 13, 15, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8a6d00'; ctx.fillRect(-2, -7, 4, 14);
      ctx.restore();
    }

    // bike
    if (crashBike) drawBike(crashBike.x, crashBike.y, crashBike.theta, crashBike.facing, S.wheel, true);
    else {
      if (S.float && S.float.kind === 'balloon') { const t = S.float.t < 0.8 && Math.sin(clock * 30) > 0; if (!t) drawBalloon(S.x + Math.sin(clock * 2) * 6, S.y - 150, S.x, S.y - 60); }
      drawBike(S.x, S.y, S.theta, S.facing, S.wheel, false);
      if (S.float && S.float.kind === 'bubble') drawBubble(S.x, S.y - 32, 62);
    }

    // particles
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;

    if (flash > 0) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = `rgba(229,57,53,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
  }

  function wheel(x, y, rot) {
    ctx.lineWidth = 5; ctx.strokeStyle = '#222'; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#777'; ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = rot + i * Math.PI / 3; ctx.moveTo(x + Math.cos(a) * 10, y + Math.sin(a) * 10); ctx.lineTo(x - Math.cos(a) * 10, y - Math.sin(a) * 10); }
    ctx.stroke();
    ctx.fillStyle = '#999'; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }

  function drawBike(x, y, theta, facing, wrot, crashed, look) {
    const st = look || currentLook();
    ctx.save(); ctx.translate(x, y); ctx.rotate(theta); ctx.scale(facing, 1);
    if (st.extra === 'cape' && !crashed) { // fluttering cape behind the rider
      ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.moveTo(2, -52); ctx.quadraticCurveTo(-20, -50 + Math.sin(clock * 12) * 5, -34, -40 + Math.sin(clock * 9) * 6); ctx.lineTo(-10, -34); ctx.closePath(); ctx.fill();
    }
    if (st.extra === 'flame' && !crashed) {
      ctx.fillStyle = `rgba(255,${120 + Math.random() * 100 | 0},0,.9)`; ctx.beginPath(); ctx.moveTo(-24, -27); ctx.lineTo(-40 - Math.random() * 14, -24); ctx.lineTo(-24, -21); ctx.fill();
    }
    if (st.extra === 'flag' && !crashed) {
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-20, -30); ctx.lineTo(-24, -82); ctx.stroke();
      ctx.fillStyle = '#43a047'; ctx.beginPath(); ctx.moveTo(-24, -82); ctx.lineTo(-48, -76 + Math.sin(clock * 10) * 3); ctx.lineTo(-23, -68); ctx.fill();
    }
    const R = 14, WX = 26;
    const rot = wrot * facing;
    wheel(-WX, -R, rot); wheel(WX, -R, rot);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // swingarm + fork
    ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-WX, -R); ctx.lineTo(-4, -24); ctx.moveTo(WX, -R); ctx.lineTo(18, -40); ctx.stroke();
    // body
    ctx.fillStyle = st.bike === 'rainbow' ? `hsl(${(clock * 120) % 360},85%,55%)` : st.bikeC; ctx.strokeStyle = st.bikeD; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-22, -30); ctx.lineTo(-4, -34); ctx.lineTo(14, -38); ctx.lineTo(22, -34); ctx.lineTo(10, -24); ctx.lineTo(-10, -22); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#424242'; ctx.fillRect(-8, -26, 14, 9);
    // exhaust
    ctx.strokeStyle = '#9e9e9e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-6, -20); ctx.lineTo(-24, -24); ctx.stroke();
    // handlebar
    ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(18, -40); ctx.lineTo(14, -48); ctx.stroke();
    if (!crashed) {
      // rider
      ctx.strokeStyle = st.suitC; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-8, -36); ctx.lineTo(4, -52); ctx.stroke();           // torso
      ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-6, -36); ctx.lineTo(6, -30); ctx.lineTo(2, -20); ctx.stroke(); // leg
      ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(4, -50); ctx.lineTo(14, -46); ctx.stroke();      // arm
      ctx.fillStyle = st.helmetC; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(7, -60, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();                   // helmet
      ctx.fillStyle = '#333'; ctx.fillRect(9, -63, 6, 4);                                              // visor
      if (st.helmet === 'chrome') { ctx.fillStyle = '#fff'; ctx.fillRect(3, -65, 3, 3); }
      if (st.helmet === 'horns') { ctx.fillStyle = '#fff8e1'; ctx.beginPath(); ctx.moveTo(1, -64); ctx.lineTo(-6, -76); ctx.lineTo(4, -67); ctx.moveTo(11, -66); ctx.lineTo(14, -79); ctx.lineTo(14, -66); ctx.fill(); }
      if (st.helmet === 'crown') { ctx.fillStyle = '#ffc107'; ctx.beginPath(); ctx.moveTo(0, -66); ctx.lineTo(1, -76); ctx.lineTo(5, -70); ctx.lineTo(8, -78); ctx.lineTo(11, -70); ctx.lineTo(15, -76); ctx.lineTo(14, -66); ctx.closePath(); ctx.fill(); }
      if (st.suit === 'ninja') { ctx.strokeStyle = '#e53935'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(-10, -56 + Math.sin(clock * 14) * 3); ctx.stroke(); }
    }
    ctx.restore();
  }

  function hud() {
    $('stats').textContent = `L${levelIndex + 1} · 🪙 ${got()}/${total()} · ⏱ ${S.time.toFixed(1)}s · 💥 ${S.deaths}${S.checkpoint ? ' · 🚩' : ''}`;
    const sp = S.mode === 'ground' ? Math.abs(S.v) : Math.hypot(S.vx, S.vy);
    $('speedtxt').textContent = Math.round(sp / 10) + ' km/h';
    $('speedfill').style.width = Math.min(100, sp / 12) + '%';
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
