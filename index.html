<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Moto Trial</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fbfaf4">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moto Trial">
<style>
  html, body { margin: 0; height: 100%; background: #fbfaf4; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); right: calc(16px + env(safe-area-inset-right)); display: flex; justify-content: space-between; pointer-events: none; color: #333; font-size: 20px; }
  #hud .box { background: rgba(255,255,255,.85); border: 2px solid #444; border-radius: 10px; padding: 6px 12px; box-shadow: 2px 3px 0 #4443; }
  #speed { width: 180px; }
  #speedbar { height: 10px; border: 2px solid #444; border-radius: 6px; margin-top: 4px; overflow: hidden; background: #eee; }
  #speedfill { height: 100%; width: 0; background: linear-gradient(90deg, #4caf50, #ffc107 60%, #e53935); }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px); }
  #panel { --px: 32px; --py: 24px; box-sizing: border-box; background: rgba(255,255,255,.97); border: 3px solid #333; border-radius: 16px; padding: var(--py) var(--px); max-width: 560px; text-align: center; box-shadow: 4px 6px 0 #3334; color: #222; }
  #panel h1 { margin: 0 0 8px; font-size: 40px; color: #1f5fbf; }
  #panel h2 { margin: 0 0 8px; font-size: 30px; }
  #panel p { margin: 8px 0; font-size: 18px; line-height: 1.4; }
  kbd { display: inline-block; border: 2px solid #444; border-bottom-width: 4px; border-radius: 6px; padding: 0 6px; font-family: inherit; background: #fff; min-width: 18px; }
  #help { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #555; font-size: 15px; pointer-events: none; }
  .hidden { display: none !important; }
  #panel { max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; pointer-events: none; }
  #panel.interactive { pointer-events: auto; }
  #panel .foot { position: sticky; bottom: calc(-1 * var(--py)); margin: 8px calc(-1 * var(--px)) calc(-1 * var(--py)); padding: 10px var(--px) calc(var(--py) - 2px);
    background: #fff; border-top: 2px dashed #ccc; border-radius: 0 0 13px 13px; z-index: 2; box-shadow: 0 -8px 12px -6px #0002; }
  #panel .foot p { margin: 4px 0; }
  #panel p.ver { margin: -4px 0 6px; font-size: 12px; color: #888; }
  #panel p.ver.new { color: #fff; background: #e65100; border-radius: 8px; padding: 4px 8px; font-size: 13px; font-weight: bold; }
  #panel.crashed button { pointer-events: auto; }
  #panel h1 { margin-bottom: 4px; }
  .mtabs { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 4px 0 10px; }
  #panel button.mt, #panel button.big, #panel button.lv, #panel button.item { pointer-events: auto; font: inherit; cursor: pointer; border: 2px solid #333; border-radius: 10px; background: #fff; color: #333; box-shadow: 2px 3px 0 #3334; }
  #panel button.mt { padding: 5px 10px; font-size: 16px; }
  #panel button.mt.on { background: #1f5fbf; color: #fff; }
  .wallet { font-weight: bold; margin-left: 6px; background: #fff3c4; border: 2px solid #c9a400; border-radius: 10px; padding: 3px 8px; }
  #panel button.big { font-size: 22px; font-weight: bold; padding: 8px 26px; background: #43a047; color: #fff; }
  .lgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 8px; }
  #panel button.lv { padding: 3px 0 1px; font-size: 15px; font-weight: bold; line-height: 1.1; }
  #panel button.lv small { display: block; font-size: 10px; font-weight: normal; white-space: nowrap; overflow: hidden; }
  #panel button.lv.done { background: #e8f5e9; border-color: #43a047; }
  #panel button.lv.sp { border-color: #ff9800; }
  #panel button.lv.on { background: #1f5fbf; color: #fff; }
  #panel button.lv.locked { background: #eee; color: #aaa; border-color: #bbb; box-shadow: none; cursor: default; }
  .lname { margin: 6px 0 2px; } .best { margin: 2px 0 6px !important; color: #555; }
  table.scores { width: 100%; border-collapse: collapse; font-size: 15px; margin: 6px 0; }
  table.scores td, table.scores th { border-bottom: 1px solid #ccc; padding: 3px 4px; }
  #pname { font: inherit; padding: 3px 8px; border: 2px solid #333; border-radius: 8px; width: 140px; }
  .shop { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #panel button.item { padding: 4px 8px; font-size: 14px; display: flex; flex-direction: column; align-items: center; min-width: 74px; }
  #panel button.item i { width: 26px; height: 14px; border-radius: 4px; border: 1px solid #333; margin-bottom: 2px; }
  #panel button.item small { font-size: 11px; color: #666; }
  #panel button.item.on { border-color: #43a047; background: #e8f5e9; }
  #panel button.item.poor { opacity: .5; }
  #panel h3 { margin: 10px 0 4px; font-size: 17px; }
  #preview { width: 260px; height: 130px; display: block; margin: 0 auto; background: #f4f1e6; border-radius: 12px; border: 2px dashed #bbb; }
  .earned { color: #a67c00; font-weight: bold; }
  @media (max-width: 640px) { .lgrid { grid-template-columns: repeat(5, 1fr); } #panel button.big { font-size: 19px; } }
  #panel button.lvl { pointer-events: auto; font: inherit; font-size: 18px; font-weight: bold; padding: 6px 16px; margin: 4px; border: 3px solid #333; border-radius: 10px; background: #fff; cursor: pointer; color: #333; box-shadow: 2px 3px 0 #3334; }
  #panel button.lvl.on { background: #1f5fbf; color: #fff; }
  #panel .tabs { margin: 6px 0 10px; }
  #panel .tabs::before { content: 'Level'; display: block; font-weight: bold; margin-bottom: 4px; }
  #panel button.lvl.num { min-width: 44px; padding: 6px 0; margin: 3px; }
  #panel .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; text-align: left; font-size: 15px; margin: 8px 0; }
  #panel .legend i { font-style: normal; font-weight: bold; display: inline-block; width: 22px; text-align: center; }
  @media (max-width: 640px) { #panel .legend { grid-template-columns: 1fr; font-size: 13px; gap: 2px; } #panel button.lvl { font-size: 15px; padding: 4px 10px; } }
  #hud .right { display: flex; gap: 8px; align-items: flex-start; }
  #hud button { pointer-events: auto; font: inherit; font-size: 20px; background: rgba(255,255,255,.85); border: 2px solid #444; border-radius: 10px; padding: 4px 10px; box-shadow: 2px 3px 0 #4443; cursor: pointer; color: #333; }
  .pad { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; border: 3px dashed #4447; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 15px; font-weight: bold; color: #444a; pointer-events: none; background: rgba(255,255,255,.35); }
  .pad span { font-size: 34px; line-height: 1; }
  .pad.on { background: rgba(255,255,255,.7); color: #333; border-style: solid; }
  #padBrake { left: 14px; } #padBrake.on { border-color: #e53935; }
  #padGas { right: 14px; } #padGas.on { border-color: #43a047; }
  body:not(.touch) .pad { display: none; }
  body.touch #help { display: none; }
  body:not(.touch) .only-touch, body.touch .only-keys { display: none; }
  @media (max-width: 640px), (max-height: 500px) {
    #hud { top: calc(8px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); right: calc(8px + env(safe-area-inset-right)); font-size: 13px; white-space: nowrap; gap: 6px; }
    #hud .box { padding: 3px 7px; }
    #hud .right { gap: 4px; }
    #hud button { font-size: 14px; padding: 3px 6px; }
    #hud .lbl { display: none; }
    #stats { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #speed { width: 58px; text-align: center; }
    #speedbar { height: 6px; margin-top: 2px; }
    #panel { --px: 14px; --py: 12px; margin: 0; width: 100%; }
    #panel .legend { font-size: 13px; gap: 1px 8px; grid-template-columns: 1fr 1fr; }
    #panel button.lv { padding: 2px 0 0; font-size: 14px; }
    .lname { font-size: 20px; }
    #panel h1 { font-size: 30px; } #panel h2 { font-size: 22px; } #panel p { font-size: 15px; }
    .pad { width: 92px; height: 92px; font-size: 12px; } .pad span { font-size: 26px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="box" id="stats">🪙 0/0 · ⏱ 0.0s · 💥 0</div>
  <div class="right">
    <div class="box" id="speed"><span class="lbl">Tempo: </span><span id="speedtxt">0</span><div id="speedbar"><div id="speedfill"></div></div></div>
    <button id="menu" title="Level-Übersicht (Esc)">☰</button>
    <button id="mute" title="Ton an/aus (M)">🔊</button>
    <button id="restart" title="Neu starten (R)">↺</button>
  </div>
</div>
<div class="pad" id="padBrake"><span>◀</span>BREMSE</div>
<div class="pad" id="padGas"><span>▶</span>GAS</div>
<div id="overlay"><div id="panel"></div></div>
<div id="help"><kbd>→</kbd>/<kbd>↑</kbd> Gas · <kbd>←</kbd>/<kbd>↓</kbd> Bremse · oder Maus: rechte Hälfte Gas, linke Bremse · <kbd>Enter</kbd> weiter · <kbd>R</kbd> neu · <kbd>M</kbd> Ton</div>
<script src="version.js"></script>
<script src="game.js"></script>
<script>
(() => {
  const cv = document.getElementById('c');
  let ctx = cv.getContext('2d');
  let levelIndex = 0;
  try { levelIndex = Math.min(MotoTrial.levelCount - 1, Number(localStorage.getItem('mototrial-level') || 0)); } catch (e) {}
  let game, S, L, coins, booted = false;
  function loadLevel(i) {
    levelIndex = i;
    try { localStorage.setItem('mototrial-level', String(i)); } catch (e) {}
    game = MotoTrial.createGame(i);
    ({ S, L, coins } = game);
    window.__moto = game; window.__load = loadLevel; // debug handles
    if (booted) {
      finishedRecord = null; crashBike = null; particles = []; cam.x = S.x + 150; cam.y = S.y + 60; updatePanel(); }
  }
  loadLevel(levelIndex);
  const keys = { up: false, down: false };
  if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');
  addEventListener('touchstart', () => document.body.classList.add('touch'), { once: true, passive: true });
  const $ = id => document.getElementById(id);
  let W = 0, H = 0, DPR = 1, zoom = 1;
  const cam = { x: S.x, y: S.y };
  let shake = 0, flash = 0, crashBike = null, particles = [], clock = 0;
  booted = true;

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    zoom = Math.max(0.45, Math.min(1.15, Math.min(W / 1400, H / 900)));
  }
  addEventListener('resize', resize); resize();


  // ---------- sound ----------
  let ac = null, eng = null, engGain = null, muted = false;
  function initAudio() {
    if (ac) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      eng = ac.createOscillator(); eng.type = 'sawtooth';
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
      engGain = ac.createGain(); engGain.gain.value = 0;
      eng.connect(f); f.connect(engGain); engGain.connect(ac.destination); eng.start();
    } catch (e) { ac = null; }
  }
  function blip(freq, dur, type, vol) {
    if (!ac || muted) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  }

  // ---------- input ----------
  // keyboard: ↑/→ gas, ↓/← brake · touch/mouse: right half gas, left half brake
  const map = { ArrowUp: 'up', ArrowRight: 'up', ArrowDown: 'down', ArrowLeft: 'down' };
  const held = new Set();          // pressed arrow keys
  const pointers = new Map();      // pointerId → 'up' | 'down'
  let crashAt = 0;
  function syncKeys() {
    keys.up = keys.down = false;
    for (const k of held) keys[map[k]] = true;
    for (const v of pointers.values()) keys[v] = true;
    $('padGas').classList.toggle('on', keys.up);
    $('padBrake').classList.toggle('on', keys.down);
  }
  function proceed() {
    if (S.status === 'ready') start();
    else if (S.status === 'crash') { if (performance.now() - crashAt > 450) respawn(); }
    else if (S.status === 'finish') nextLevel();
  }
  addEventListener('keydown', e => {
    initAudio();
    if (map[e.key]) { held.add(e.key); syncKeys(); e.preventDefault(); if (S.status === 'ready') start(); }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); proceed(); }
    if (e.key === 'r' || e.key === 'R') restart();
    if (e.key === 'Escape') toMenu();
    if (/^[0-9]$/.test(e.key) && S.status !== 'run') { const n = e.key === '0' ? 10 : Number(e.key); if (n <= MotoTrial.levelCount && isUnlocked(n - 1)) loadLevel(n - 1); }
    if (e.key === 'm' || e.key === 'M') toggleMute();
  });
  addEventListener('keyup', e => { if (map[e.key]) { held.delete(e.key); syncKeys(); e.preventDefault(); } });
  addEventListener('pointerdown', e => {
    if (e.target.closest && (e.target.closest('button') || e.target.closest('input') || (S.status !== 'crash' && S.status !== 'run' && e.target.closest('#panel')))) return;
    initAudio();
    e.preventDefault();
    if (S.status === 'crash') { proceed(); return; }
    if (S.status !== 'run') return;
    pointers.set(e.pointerId, e.clientX >= innerWidth / 2 ? 'up' : 'down');
    syncKeys();
  }, { passive: false });
  const release = e => { if (pointers.delete(e.pointerId)) syncKeys(); };
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('blur', () => { held.clear(); pointers.clear(); syncKeys(); });
  function restart() { game.reset(true); finishedRecord = null; start(); }
  function toggleMute() { muted = !muted; if (engGain) engGain.gain.value = 0; $('mute').textContent = muted ? '🔇' : '🔊'; }
  $('restart').addEventListener('click', e => { e.stopPropagation(); initAudio(); restart(); });
  $('menu').addEventListener('click', e => { e.stopPropagation(); initAudio(); toMenu(); });
  function toMenu() { menuTab = 'levels'; crashBike = null; game.reset(true); pointers.clear(); held.clear(); syncKeys(); updatePanel(); }
  $('mute').addEventListener('click', e => { e.stopPropagation(); initAudio(); toggleMute(); });

  function start() { if (S.status === 'ready' && !isUnlocked(levelIndex)) return; if (S.status === 'ready') { S.status = 'run'; finishedRecord = null; } crashBike = null; updatePanel(); }
  function respawn() { game.reset(false); crashBike = null; updatePanel(); }

  // ---------- profile: wallet, garage, results (all local) ----------
  const SHOP = {
    bike: [
      { id: 'red', name: 'Rot', price: 0, c: '#e53935', d: '#8e1c1a' }, { id: 'blue', name: 'Blau', price: 30, c: '#1e88e5', d: '#0d47a1' },
      { id: 'green', name: 'Grün', price: 30, c: '#43a047', d: '#1b5e20' }, { id: 'pink', name: 'Pink', price: 60, c: '#ec407a', d: '#880e4f' },
      { id: 'black', name: 'Schwarz', price: 60, c: '#424242', d: '#111' }, { id: 'gold', name: 'Gold', price: 200, c: '#ffc107', d: '#a67c00' },
      { id: 'rainbow', name: 'Regenbogen', price: 400, c: '#e91e63', d: '#333' },
    ],
    helmet: [
      { id: 'yellow', name: 'Gelb', price: 0, c: '#fdd835' }, { id: 'white', name: 'Weiß', price: 20, c: '#fafafa' }, { id: 'red', name: 'Rot', price: 20, c: '#e53935' },
      { id: 'blue', name: 'Blau', price: 20, c: '#1e88e5' }, { id: 'chrome', name: 'Chrom', price: 120, c: '#b0bec5' },
      { id: 'horns', name: 'Wikinger', price: 250, c: '#8d6e63' }, { id: 'crown', name: 'Krone', price: 500, c: '#fdd835' },
    ],
    suit: [
      { id: 'blue', name: 'Blau', price: 0, c: '#1e3a8a' }, { id: 'red', name: 'Rot', price: 40, c: '#b71c1c' }, { id: 'green', name: 'Grün', price: 40, c: '#2e7d32' },
      { id: 'black', name: 'Schwarz', price: 80, c: '#212121' }, { id: 'ninja', name: 'Ninja', price: 150, c: '#311b92' },
    ],
    extra: [
      { id: 'none', name: 'Nichts', price: 0, c: '#ddd' }, { id: 'flag', name: 'Fahne', price: 80, c: '#43a047' },
      { id: 'cape', name: 'Umhang', price: 150, c: '#c62828' }, { id: 'flame', name: 'Feuer-Auspuff', price: 300, c: '#ff9800' },
    ],
  };
  const CAT_NAMES = { bike: '🏍️ Motorrad', helmet: '⛑️ Helm', suit: '🧥 Anzug', extra: '✨ Extra' };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const profile = Object.assign({ wallet: 0, name: 'Spieler', owned: { bike: ['red'], helmet: ['yellow'], suit: ['blue'], extra: ['none'] }, sel: { bike: 'red', helmet: 'yellow', suit: 'blue', extra: 'none' } }, store.get('mototrial-profile', {}));
  const results = store.get('mototrial-results', null) || (() => { // migrate old single records
    const r = {};
    for (let i = 0; i < 10; i++) {
      const old = store.get(i === 0 ? 'mototrial-best' : 'mototrial-best-' + (i + 1), null);
      if (old) r[i] = [{ score: old.coins, time: old.time, deaths: 0, date: '', name: profile.name }];
    }
    return r;
  })();
  // a level opens once the one before it has been finished
  const isUnlocked = i => i === 0 || !!(results[i - 1] && results[i - 1].length);
  const highestUnlocked = () => { let i = 0; while (i + 1 < MotoTrial.levelCount && isUnlocked(i + 1)) i++; return i; };
  if (!isUnlocked(levelIndex)) loadLevel(highestUnlocked());
  const saveProfile = () => store.set('mototrial-profile', profile);
  const saveResults = () => store.set('mototrial-results', results);
  function currentLook() {
    const f = cat => SHOP[cat].find(i => i.id === profile.sel[cat]) || SHOP[cat][0];
    const b = f('bike');
    return { bike: b.id, bikeC: b.c, bikeD: b.d, helmet: profile.sel.helmet, helmetC: f('helmet').c, suit: profile.sel.suit, suitC: f('suit').c, extra: profile.sel.extra };
  }
  const bestOf = i => (results[i] || [])[0];
  const scoreOf = list => list.reduce((a, c) => a + c.v, 0);

  // which elements appear in a level → legend entries
  function legendFor(L) {
    const has = k => L.grounds.some(g => g.segs.some(s => s.kind === k));
    const items = [];
    const add = (ok, icon, col, txt) => { if (ok) items.push(`<span><i style="color:${col}">${icon}</i> ${txt}</span>`); };
    add(L.spikes.some(s => s.dir !== 'lava') || L.gates.length, '▲', '#e91e63', 'Stacheln – nicht berühren!');
    add(L.spikes.some(s => s.dir === 'lava'), '♨', '#ff5722', 'Lava – tödlich heiß!');
    add(L.grounds.some(g => g.segs.some(s => s.kind === 'conv' && s.conv > 0)), '➜', '#e6b800', 'Förderband – gibt Tempo');
    add(L.grounds.some(g => g.segs.some(s => s.kind === 'conv' && s.conv < 0)), '⟵', '#e6b800', 'Rückwärts-Band – Vollgas!');
    add(L.flaps.length, '▬', '#7cb342', 'Klappteil – klappt weg, schnell drüber!');
    add(L.saws.some(s => s.style !== 'spike'), '✹', '#2e7d32', 'Säge – dreht sich im Kreis');
    add(L.saws.some(s => s.style === 'spike'), '✹', '#e91e63', 'Stachelrad');
    add(has('tramp'), '▬', '#1f5fbf', 'Trampolin – schleudert dich hoch');
    add(has('magnet'), '≋', '#d99a00', 'Magnet – hält dich fest');
    add(has('loop'), '◯', '#555', 'Looping – braucht viel Tempo!');
    add(has('ice'), '▬', '#8fd3f4', 'Eis – Gas & Bremse greifen kaum');
    add(has('soft'), '▬', '#9e9e9e', 'Polster – weiche Landung');
    add(L.buttons.length, '■', '#ff8a3d', 'Knopf – drüberfahren!');
    add(L.doors.length, '🚪', '#8d6e63', 'Tür – öffnet sich per Knopf (evtl. rückwärts fahren!)');
    add(L.movers.some(m => m.mode === 'loop' && !m.cable), '⇆', '#9c4dcc', 'bewegliche Plattform / Aufzug');
    add(L.movers.some(m => m.cable), '🚡', '#ff8a3d', 'Seilbahn – rein, mitfahren, raus');
    add(L.fans.some(f => f.vt > 0), '✱', '#ff7043', 'Ventilator – bremst deinen Fall');
    add(L.fans.some(f => f.vt < 0), '✱', '#7b1fa2', 'lila Ventilator – hebt dich hoch');

  // ---------- loop ----------
  let lastT = performance.now(), acc = 0;

  function frame(now) {

      ctx.fillStyle = '#ff5722'; ctx.fillRect(80, -24, 14, 48);
      ctx.restore();
      ctx.fillStyle = '#5d4037'; ctx.beginPath(); ctx.arc(c.x - 24, c.y - 18, 18, 0, PI2); ctx.arc(c.x + 24, c.y - 18, 18, 0, PI2); ctx.fill();
      ctx.fillStyle = '#ffca28'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('💥', c.x, c.y - 100);
    }
    // birds
    for (const b of L.birds) {
      const [bx, by, dir] = game.birdPos(b, S.clock), flap = Math.sin(clock * 18 + b.phase) * 12;
      ctx.save(); ctx.translate(bx, by); ctx.scale(dir >= 0 ? 1 : -1, 1);
      ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.ellipse(0, 0, 20, 11, 0, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(-20, -14 - flap); ctx.lineTo(8, -6); ctx.fill();
      ctx.fillStyle = '#ff9800'; ctx.beginPath(); ctx.moveTo(18, -3); ctx.lineTo(30, 1); ctx.lineTo(18, 5); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(11, -4, 4, 0, PI2); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(12, -4, 2, 0, PI2); ctx.fill();
      ctx.restore();
    }
    // piranhas
    for (const f of L.piranhas) {
      const [px, py, sn] = game.piranhaPos(f, S.clock), up = sn > 0 ? -1 : 1;
      ctx.save(); ctx.translate(px, py); ctx.rotate(up * 0.6 - Math.PI / 2 * (sn > 0 ? 1 : 0) * 0.5);
      ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 14, 0, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-32, -10); ctx.lineTo(-32, 10); ctx.fill();
      ctx.fillStyle = '#fff'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(8 + i * 4, 3); ctx.lineTo(10 + i * 4, 8); ctx.lineTo(12 + i * 4, 3); ctx.fill(); }
      ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(10, -5, 3, 0, PI2); ctx.fill();
      ctx.restore();
    }
    // floaters (balloons and soap bubbles waiting to be grabbed)
    for (const f of L.floaters) {
      if (f.taken) continue;
      const bob = Math.sin(clock * 2 + f.x) * 6;
      if (f.kind === 'balloon') drawBalloon(f.x, f.y - 40 + bob, f.x, f.y + 20);
      else drawBubble(f.x, f.y + bob, 34);
    }

    // portals
    for (const pt of L.portals) {
      for (const [x, y, k] of [[pt.ax, pt.ay, 1], [pt.bx, pt.by - 36, -1]]) {
        ctx.save(); ctx.translate(x, y);
        ctx.strokeStyle = pt.color; ctx.lineWidth = 3; ctx.beginPath();
        for (let i = 0; i < 10; i++) { const a = i * PI2 / 10 + clock * 0.8; ctx.moveTo(Math.cos(a) * 44, Math.sin(a) * 58); ctx.lineTo(Math.cos(a) * 54, Math.sin(a) * 70); }
        ctx.stroke();
        ctx.globalAlpha = 0.85; ctx.fillStyle = pt.color; ctx.beginPath(); ctx.ellipse(0, 0, 34, 48, 0, 0, PI2); ctx.fill();
        ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(0, 0, 26 - i * 8, 38 - i * 11, k * clock * (2 + i), 0, Math.PI * 1.3); ctx.stroke(); }
        ctx.restore();
      }
    }

    // coins
    for (const c of coins) {
      if (c.taken || c.x < vx0 - 30 || c.x > vx0 + vw + 30) continue;
      const sxk = Math.abs(Math.cos(clock * 3 + c.x * 0.01)) * 0.75 + 0.25;
      ctx.save(); ctx.translate(c.x, c.y);
      if (c.v > 1) { // star coin, worth more
        ctx.rotate(Math.sin(clock * 2 + c.x) * 0.3); ctx.scale(1.15 + Math.sin(clock * 5) * 0.08, 1.15 + Math.sin(clock * 5) * 0.08);
        ctx.fillStyle = '#ff9800'; ctx.strokeStyle = '#e65100'; ctx.lineWidth = 3; ctx.beginPath();
        for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 9 : 21; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(c.v, 0, 5);
        ctx.restore(); continue;
      }
      ctx.scale(sxk, 1);
      ctx.fillStyle = '#f5c400'; ctx.strokeStyle = '#8a6d00'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, 0, 13, 15, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8a6d00'; ctx.fillRect(-2, -7, 4, 14);
      ctx.restore();
    }

    // bike
    if (crashBike) drawBike(crashBike.x, crashBike.y, crashBike.theta, crashBike.facing, S.wheel, true);
    else {
      if (S.float && S.float.kind === 'balloon') { const t = S.float.t < 0.8 && Math.sin(clock * 30) > 0; if (!t) drawBalloon(S.x + Math.sin(clock * 2) * 6, S.y - 150, S.x, S.y - 60); }
      drawBike(S.x, S.y, S.theta, S.facing, S.wheel, false);
      if (S.float && S.float.kind === 'bubble') drawBubble(S.x, S.y - 32, 62);
    }

    // particles
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;

    if (flash > 0) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = `rgba(229,57,53,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
  }

  function wheel(x, y, rot) {
    ctx.lineWidth = 5; ctx.strokeStyle = '#222'; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#777'; ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = rot + i * Math.PI / 3; ctx.moveTo(x + Math.cos(a) * 10, y + Math.sin(a) * 10); ctx.lineTo(x - Math.cos(a) * 10, y - Math.sin(a) * 10); }
    ctx.stroke();
    ctx.fillStyle = '#999'; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }

  function drawBike(x, y, theta, facing, wrot, crashed, look) {
    const st = look || currentLook();
    ctx.save(); ctx.translate(x, y); ctx.rotate(theta); ctx.scale(facing, 1);
    if (st.extra === 'cape' && !crashed) { // fluttering cape behind the rider
      ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.moveTo(2, -52); ctx.quadraticCurveTo(-20, -50 + Math.sin(clock * 12) * 5, -34, -40 + Math.sin(clock * 9) * 6); ctx.lineTo(-10, -34); ctx.closePath(); ctx.fill();
    }
    if (st.extra === 'flame' && !crashed) {
      ctx.fillStyle = `rgba(255,${120 + Math.random() * 100 | 0},0,.9)`; ctx.beginPath(); ctx.moveTo(-24, -27); ctx.lineTo(-40 - Math.random() * 14, -24); ctx.lineTo(-24, -21); ctx.fill();
    }
    if (st.extra === 'flag' && !crashed) {
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-20, -30); ctx.lineTo(-24, -82); ctx.stroke();
      ctx.fillStyle = '#43a047'; ctx.beginPath(); ctx.moveTo(-24, -82); ctx.lineTo(-48, -76 + Math.sin(clock * 10) * 3); ctx.lineTo(-23, -68); ctx.fill();
    }
    const R = 14, WX = 26;
    const rot = wrot * facing;
    wheel(-WX, -R, rot); wheel(WX, -R, rot);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // swingarm + fork
    ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-WX, -R); ctx.lineTo(-4, -24); ctx.moveTo(WX, -R); ctx.lineTo(18, -40); ctx.stroke();
    // body
    ctx.fillStyle = st.bike === 'rainbow' ? `hsl(${(clock * 120) % 360},85%,55%)` : st.bikeC; ctx.strokeStyle = st.bikeD; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-22, -30); ctx.lineTo(-4, -34); ctx.lineTo(14, -38); ctx.lineTo(22, -34); ctx.lineTo(10, -24); ctx.lineTo(-10, -22); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#424242'; ctx.fillRect(-8, -26, 14, 9);
    // exhaust
    ctx.strokeStyle = '#9e9e9e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-6, -20); ctx.lineTo(-24, -24); ctx.stroke();
    // handlebar
    ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(18, -40); ctx.lineTo(14, -48); ctx.stroke();
    if (!crashed) {
      // rider
      ctx.strokeStyle = st.suitC; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-8, -36); ctx.lineTo(4, -52); ctx.stroke();           // torso
      ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-6, -36); ctx.lineTo(6, -30); ctx.lineTo(2, -20); ctx.stroke(); // leg
      ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(4, -50); ctx.lineTo(14, -46); ctx.stroke();      // arm
      ctx.fillStyle = st.helmetC; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(7, -60, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();                   // helmet
      ctx.fillStyle = '#333'; ctx.fillRect(9, -63, 6, 4);                                              // visor
      if (st.helmet === 'chrome') { ctx.fillStyle = '#fff'; ctx.fillRect(3, -65, 3, 3); }
      if (st.helmet === 'horns') { ctx.fillStyle = '#fff8e1'; ctx.beginPath(); ctx.moveTo(1, -64); ctx.lineTo(-6, -76); ctx.lineTo(4, -67); ctx.moveTo(11, -66); ctx.lineTo(14, -79); ctx.lineTo(14, -66); ctx.fill(); }
      if (st.helmet === 'crown') { ctx.fillStyle = '#ffc107'; ctx.beginPath(); ctx.moveTo(0, -66); ctx.lineTo(1, -76); ctx.lineTo(5, -70); ctx.lineTo(8, -78); ctx.lineTo(11, -70); ctx.lineTo(15, -76); ctx.lineTo(14, -66); ctx.closePath(); ctx.fill(); }
      if (st.suit === 'ninja') { ctx.strokeStyle = '#e53935'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(-10, -56 + Math.sin(clock * 14) * 3); ctx.stroke(); }
    }
    ctx.restore();
  }

  function hud() {
    const sep = innerWidth < 640 ? ' ' : ' · ';
    $('stats').textContent = [`L${levelIndex + 1}`, `🪙${got()}/${total()}`, `⏱${S.time.toFixed(1)}`, `💥${S.deaths}`].join(sep) + (S.checkpoint ? sep + '🚩' : '');
    const sp = S.mode === 'ground' ? Math.abs(S.v) : Math.hypot(S.vx, S.vy);
    $('speedtxt').textContent = Math.round(sp / 10) + ' km/h';
    $('speedfill').style.width = Math.min(100, sp / 12) + '%';
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
